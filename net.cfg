;  EVE 自走棋 · 联机中继服务器（**给玩家分发的那一份**）
; ══════════════════════════════════════════════════════════════════
;  这里填的地址会被**打进 APK / EXE**：
;  玩家装完游戏什么都不用配，双方只交换一个 8 位房间码。
;
;  格式：server="域名或IP:端口"
;  ⚠️ 端口必须 == 樱花隧道的「远程端口」== 中继进程监听的端口（三者一致）。
;
;  填好之后重新导出即可；本机临时覆盖可以改 user://net.cfg（不用重打包）。
[relay]
server=""
